# CI gate: every pull request and every push to main runs scripts/check.
# Make the job "check" a required status check on main (recipes/mandatory-gates.md).
# Do not add "if:" or path filters to this job: GitHub counts a skipped required check as passing.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the secret scan (R-1) also sees old commits

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install gitleaks (secret scan, M-03 / R-1)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$file" -o "$RUNNER_TEMP/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/sums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" sums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: scripts/check (installs from the lockfile, then runs every machine check)
        run: bash scripts/check --ci

      - name: Page tests
        run: npm test --prefix apps/web

      - name: SBOM from requirements.txt via a clean install and pip freeze
        run: |
          python -m venv "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          "$RUNNER_TEMP/app/bin/python" -m pip freeze > "$RUNNER_TEMP/freeze.txt"
          python - "$RUNNER_TEMP/freeze.txt" <<'PY'
          import sys
          from pathlib import Path
          def pins(path):
              rows = []
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      rows.append(line)
              return rows
          locked = pins("requirements.txt")
          frozen = pins(sys.argv[1])
          if locked != frozen:
              raise SystemExit(
                  "pip freeze does not match requirements.txt\n"
                  f"only in lock: {sorted(set(locked) - set(frozen))}\n"
                  f"only in freeze: {sorted(set(frozen) - set(locked))}"
              )
          PY
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/python" -m pip install --disable-pip-version-check cyclonedx-bom
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment \
            "$RUNNER_TEMP/app/bin/python" \
            --output-reproducible \
            --no-validate \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file bom.json

      - name: Upload bom.json
        uses: actions/upload-artifact@v7
        with:
          name: bom.json
          path: bom.json
          if-no-files-found: error
          retention-days: 90

  review-import:
    name: review-import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install md-json-review from main
        run: python -m pip install "git+https://github.com/wisdom-km/md-json-review.git@main"

      - name: Import the synthetic OCR fixture
        run: python -m unittest integration.test_review_tool_import -v

  postgres:
    name: postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: k12
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: k12
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U k12 -d k12"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install drivers
        run: python -m pip install -r requirements.txt

      - name: Migrate up, down, then up
        env:
          K12_PG_DSN: postgresql://k12:changeme@localhost:5432/k12
        run: |
          python scripts/migrate.py up
          python scripts/migrate.py down
          python scripts/migrate.py up

      - name: Identity contract tests
        env:
          K12_PG_DSN: postgresql://k12:changeme@localhost:5432/k12
        run: python -m unittest discover -s tests/identity -v

      - name: Catalog and practice contract tests
        env:
          K12_PG_DSN: postgresql://k12:changeme@localhost:5432/k12
        run: python -m unittest tests.test_catalog_practice_contract -v

      - name: Migration lock
        env:
          K12_PG_DSN: postgresql://k12:changeme@localhost:5432/k12
        run: python -m unittest tests.test_migrate_lock -v

  deps-audit:
    name: deps-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install the lockfile and freeze it
        run: |
          python -m venv "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          "$RUNNER_TEMP/app/bin/python" -m pip freeze > "$RUNNER_TEMP/freeze.txt"

      - name: pip-audit enforce
        env:
          PIP_AUDIT_PROGRESS_SPINNER: "off"
        run: |
          EXPIRY_DAYS_LEFT=$(( ( $(date -d '2026-12-31' +%s) - $(date +%s) ) / 86400 ))
          echo "::notice::pip-audit waiver expires in $EXPIRY_DAYS_LEFT days"
          if [ "$EXPIRY_DAYS_LEFT" -lt 0 ]; then
            echo "::error::pip-audit waiver has expired. Renew or upgrade."
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install --disable-pip-version-check pip-audit
          # pip-audit has no waiver file. These ids are the whole set. See
          # docs/release/E1-waiver-rationale-2026-11-22.md and issue 70.
          ignore=(
          )
          echo "===== requirements.txt ====="
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --strict --format json -r requirements.txt "${ignore[@]}"
          echo "===== pip freeze ====="
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --strict --format json -r "$RUNNER_TEMP/freeze.txt" "${ignore[@]}"
