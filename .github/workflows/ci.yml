# CI gate: every pull request and every push to main runs scripts/check.
# Make the job "check" a required status check on main (recipes/mandatory-gates.md).
# Do not add "if:" or path filters to this job: GitHub counts a skipped required check as passing.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the secret scan (R-1) also sees old commits

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install gitleaks (secret scan, M-03 / R-1)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$file" -o "$RUNNER_TEMP/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/sums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" sums.txt | sha256sum -c -)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: scripts/check (installs from the lockfile, then runs every machine check)
        run: bash scripts/check --ci
