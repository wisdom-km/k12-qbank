# Local PostgreSQL only. The password is not a production secret.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: k12
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: k12
    ports:
      - "5432:5432"
    volumes:
      - k12_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k12 -d k12"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  k12_pg:
