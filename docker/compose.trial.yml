# Trial stack. postgres and app stay on this network. Only nginx publishes HTTPS.
# This file does not change docker/compose.yml. It does not publish 5432 or 8765.
# The project name stays clear of a container already named postgres.

name: k12-trial

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: k12
      POSTGRES_PASSWORD: ${K12_PG_PASSWORD:?}
      POSTGRES_DB: ${K12_PG_DATABASE:-k12_trial}
    volumes:
      - k12_trial_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k12 -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      K12_ENV: production
      K12_SESSION_SECURE: "1"
      K12_OPENAPI: "0"
      K12_FILE_DIR: /data/files
      K12_LOG_DIR: /data/logs
      K12_PG_DSN: postgresql://k12:${K12_PG_PASSWORD:?}@postgres:5432/${K12_PG_DATABASE:-k12_trial}
      K12_CORS_ORIGINS: ${K12_CORS_ORIGINS:?}
      K12_BOOTSTRAP_ADMIN_USERNAME: ${K12_BOOTSTRAP_ADMIN_USERNAME:-}
      K12_BOOTSTRAP_ADMIN_PASSWORD: ${K12_BOOTSTRAP_ADMIN_PASSWORD:-}
      K12_AI_PROVIDER: ${K12_AI_PROVIDER:-mock}
      K12_AI_BASE_URL: ${K12_AI_BASE_URL:-}
      K12_AI_MODEL: ${K12_AI_MODEL:-}
      K12_AI_API_KEY: ${K12_AI_API_KEY:-}
      K12_AI_TIMEOUT_SECONDS: ${K12_AI_TIMEOUT_SECONDS:-60}
      K12_AI_DAILY_LIMIT: ${K12_AI_DAILY_LIMIT:-500}
      K12_AI_REVIEW_THRESHOLD: ${K12_AI_REVIEW_THRESHOLD:-}
      K12_PAPER_QR: ${K12_PAPER_QR:-on}
      K12_PAPER_LAYOUT_PATH: ${K12_PAPER_LAYOUT_PATH:-}
      K12_PDF_FONT_PATH: ${K12_PDF_FONT_PATH:-/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc}
      K12_INTAKE_RETENTION_DAYS: ${K12_INTAKE_RETENTION_DAYS:-30}
      K12_INTAKE_MAX_BYTES: ${K12_INTAKE_MAX_BYTES:-10485760}
      K12_ERROR_WEBHOOK_URL: ${K12_ERROR_WEBHOOK_URL:-}
      K12_PG_POOL_MIN: ${K12_PG_POOL_MIN:-1}
      K12_PG_POOL_MAX: ${K12_PG_POOL_MAX:-5}
      K12_LOG_FILE: ${K12_LOG_FILE:-1}
      K12_LOG_RETAIN_DAYS: ${K12_LOG_RETAIN_DAYS:-14}
      K12_AUDIT_RETAIN_DAYS: ${K12_AUDIT_RETAIN_DAYS:-1825}
      K12_SESSION_IDLE_MINUTES: ${K12_SESSION_IDLE_MINUTES:-60}
      K12_SESSION_ABSOLUTE_HOURS: ${K12_SESSION_ABSOLUTE_HOURS:-12}
      K12_RATE_LIMIT_LOGIN: ${K12_RATE_LIMIT_LOGIN:-1}
      K12_SECURITY_HEADERS: ${K12_SECURITY_HEADERS:-1}
    volumes:
      - k12_trial_files:/data/files
      - k12_trial_logs:/data/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${K12_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${K12_CERT_DIR:-../var/certs}:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  k12_trial_pg:
    name: k12_trial_pg
  k12_trial_files:
    name: k12_trial_files
  k12_trial_logs:
    name: k12_trial_logs
