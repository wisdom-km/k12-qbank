# scripts/check settings. One KEY=value per line. Lines starting with # are ignored.
# This file is read as plain text (never executed). Keep values on one line.
# Item IDs (M-xx, R-x) come from project-essentials MANDATORY.md.

# Tier: demo | tracer | long. Unknown or empty = tracer (and the report says so).
TIER=long

# [D] the project stores real user data: yes | no
REAL_DATA=yes
# [P] other people can reach it (deployed, shared, installed by others): yes | no
PUBLIC=yes

# M-02: recorded in the README. Empty SERVICE_CMD means this command is not started.
# There is no HTTP process yet, so SERVICE_CMD stays empty on purpose.
# When the FastAPI app can start, set SERVICE_CMD to that command. CI and a full local check then run it.
RUN_CMD=python scripts/status.py
SERVICE_CMD=

# M-06: TEST_KIND stays docs while TEST_CMD is only the document smoke.
# BUSINESS_TEST_CMD is the minimal core test. It is not a contract test or an end-to-end test.
TEST_CMD=python scripts/smoke_docs.py
TEST_KIND=docs
BUSINESS_TEST_CMD=python -m unittest discover -s tests -v

# M-09: no dependency manifest yet. Leave empty until a lockfile install exists.
# The first manifest must set APP_DIRS to its directory and INSTALL_CMD to a locked install.
INSTALL_CMD=

# Space-separated folders that each have their own dependency manifest. Default: .
APP_DIRS=.

# Dependency direction and hard size cap.
LINT_CMD=python scripts/check_boundaries.py

# F-13: business slices allowed in this phase. Space-separated. No inline comment.
# kernel and bootstrap are always allowed and are not listed here.
# Blank value uses catalog and practice. A non-empty PHASE_SLICES environment
# variable overrides this line. Widen it only in the same change as the exec
# plan and ARCHITECTURE.md. Do not widen it just to make the check pass.
PHASE_SLICES=catalog practice

# M-04: logging rules a machine can check.
LOG_CHECK_CMD=python scripts/check_logging.py

# Bare print / console.log forbidden here.
CORE_DIRS=backend/kernel
